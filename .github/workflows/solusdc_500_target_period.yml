name: SOLUSDC 500 2024-01-04 to 2026-09-19 Research

on:
  push:
    branches:
      - research-solusdc-500-20240104-20260919-20260920
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pandas numpy requests
        run: python -m pip install pandas numpy requests
      - name: Check Python syntax
        run: python -m py_compile research/solusdc_500_target_period.py research/pullback_stage1.py
      - name: Run exact period SOLUSDC original vs 0.20N
        run: |
          python -m research.solusdc_500_target_period
      - name: Upload result and data coverage audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solusdc-500-20240104-20260919
          path: results_solusdc_500_target_period/
          if-no-files-found: warn

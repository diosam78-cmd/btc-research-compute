name: Turtle Stage 5 Split Pyramid Adds
on:
  push:
    branches:
      - research-turtle-stage5-split-add-20260917
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install pandas numpy requests tabulate
      - name: Fetch pinned baseline engine
        run: |
          curl -fsSL https://raw.githubusercontent.com/diosam78-cmd/btc-research-compute/research-turtle-pullback-stage1-20260917/research/pullback_stage1.py -o research/pullback_stage1_core.py
      - name: Run strict invariance and split add comparison
        run: python research/split_add_stage5.py
      - name: Archive results
        uses: actions/upload-artifact@v4
        with:
          name: turtle-stage5-split-add-results
          path: results_split_add_stage5/
          if-no-files-found: error

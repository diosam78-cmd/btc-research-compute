name: Turtle partial reentry 40 percent cost sensitivity
on:
  push:
    branches:
      - research-add-risk-budget-20260920
    paths:
      - research/partial_reentry_cost_b_stress.py
      - .github/workflows/partial_reentry_cost_b.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install numpy pandas requests
      - name: Syntax
        run: python -m py_compile research/partial_reentry_cost_b_stress.py research/partial_reentry_followup.py research/partial_reentry_stage6.py
      - name: Baseline versus 40 percent partial reentry with costs
        run: python -m research.partial_reentry_cost_b_stress
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turtle-partial-reentry-40pct-cost-stress
          path: results_partial_reentry_cost_b/
          if-no-files-found: warn

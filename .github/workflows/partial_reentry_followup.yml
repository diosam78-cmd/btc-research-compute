name: Turtle selective partial reentry research
on:
  push:
    branches:
      - research-add-risk-budget-20260920
    paths:
      - research/partial_reentry_followup.py
      - .github/workflows/partial_reentry_followup.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  followup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install numpy pandas requests
      - name: Check syntax
        run: python -m py_compile research/partial_reentry_followup.py research/partial_reentry_stage6.py research/pullback_stage1.py
      - name: Selective four-coin scenarios and cost sensitivity
        run: python -m research.partial_reentry_followup
      - name: Save audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turtle-selective-partial-reentry-followup
          path: results_partial_reentry_followup/
          if-no-files-found: warn

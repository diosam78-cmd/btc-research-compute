name: Turtle Pullback Stage 1

on:
  push:
    branches:
      - research-turtle-pullback-stage1-20260917
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install pandas numpy requests

      - name: Run stage-1 pullback research
        run: python research/pullback_stage1.py

      - name: Upload research results
        uses: actions/upload-artifact@v4
        with:
          name: turtle-pullback-stage1-results
          path: results_pullback_stage1/
          if-no-files-found: error

name: Approved old Actions cleanup 20260929
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/ci.yml
permissions:
  actions: write
  contents: read
concurrency:
  group: approved-actions-cleanup-20260929
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.event.head_commit.message == 'User-approved old Actions cleanup 20260929 public retry'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CLEANUP_EXPECTED_REPO: diosam78-cmd/btc-research-compute
      CLEANUP_CUTOFF_UTC: '2026-09-29T10:00:04Z'
    steps:
    - name: Freeze approved inventory and protect research releases
      run: |
        cat > /tmp/approved_cleanup.py <<'PYCODE'
        import argparse
        import datetime
        import hashlib
        import json
        import os
        from pathlib import Path
        import re
        import time
        import urllib.error
        import urllib.request

        ALLOWED_REPOS = {"diosam78-cmd/btc3m-cloud-research", "diosam78-cmd/btc-research-compute"}
        APPROVED_PRIOR_CLEANUP_RUN = {
            "diosam78-cmd/btc3m-cloud-research": 36553617863,
            "diosam78-cmd/btc-research-compute": 36553639817,
        }
        STATE = Path("/tmp/approved-actions-cleanup-20260929.json")


        def older(item, cutoff):
            return bool(item.get("created_at")) and item["created_at"] <= cutoff


        class API:
            def __init__(self):
                self.repo = os.environ["GITHUB_REPOSITORY"]
                assert self.repo in ALLOWED_REPOS
                assert self.repo == os.environ["CLEANUP_EXPECTED_REPO"]
                self.base = "https://api.github.com/repos/" + self.repo
                self.token = os.environ["GH_TOKEN"]
                self.last_mutation = 0.0

            def request(self, method, path, missing_ok=False):
                if method == "GET":
                    assert path.startswith("/actions/") or path.startswith("/releases")
                elif method == "DELETE":
                    assert re.fullmatch(r"/actions/(runs|artifacts|caches)/[0-9]+", path)
                    if path.startswith("/actions/runs/"):
                        assert int(path.rsplit("/", 1)[1]) != int(os.environ["GITHUB_RUN_ID"])
                elif method == "PUT":
                    assert re.fullmatch(r"/actions/workflows/[0-9]+/disable", path)
                else:
                    raise AssertionError("Unapproved HTTP method")
                for attempt in range(4):
                    if method != "GET":
                        time.sleep(max(0.0, 0.9 - (time.monotonic() - self.last_mutation)))
                        self.last_mutation = time.monotonic()
                    req = urllib.request.Request(self.base + path, method=method, headers={
                        "Authorization": "Bearer " + self.token,
                        "Accept": "application/vnd.github+json",
                        "X-GitHub-Api-Version": "2022-11-28",
                        "User-Agent": "approved-actions-cleanup-20260929",
                    })
                    try:
                        with urllib.request.urlopen(req, timeout=60) as response:
                            raw = response.read()
                            return json.loads(raw) if raw else {"http_status": response.status}
                    except urllib.error.HTTPError as exc:
                        if missing_ok and exc.code == 404:
                            return {"http_status": 404}
                        body = exc.read().decode("utf-8", errors="replace")
                        message = body[:300]
                        try:
                            message = json.loads(body).get("message", message)
                        except ValueError:
                            pass
                        retry = exc.headers.get("Retry-After")
                        if attempt < 3 and (exc.code == 429 or (exc.code == 403 and retry)):
                            wait = max(1, int(retry or 60))
                            print("RATE_WAIT", wait, flush=True)
                            time.sleep(wait)
                            continue
                        raise RuntimeError(f"HTTP {exc.code} {method} {path}: {message}") from None

            def listing(self, path, key=None):
                values = []
                for page in range(1, 101):
                    data = self.request("GET", f"{path}?per_page=100&page={page}")
                    items = data if key is None else data[key]
                    values.extend(items)
                    if len(items) < 100:
                        return values
                raise RuntimeError("Pagination limit exceeded; no incomplete inventory is allowed")


        def save(state):
            temporary = STATE.with_suffix(".tmp")
            temporary.write_text(json.dumps(state, separators=(",", ":")))
            temporary.replace(STATE)


        def release_identity(api):
            return sorted((release["id"], asset["id"], asset["size"])
                          for release in api.listing("/releases")
                          for asset in release.get("assets", []))


        def inventory(api):
            cutoff = os.environ["CLEANUP_CUTOFF_UTC"]
            assert cutoff == "2026-09-29T10:00:04Z"
            all_runs = api.listing("/actions/runs", "workflow_runs")
            extra_run = APPROVED_PRIOR_CLEANUP_RUN[api.repo]
            runs = [x for x in all_runs if older(x, cutoff) or x['id'] == extra_run]
            assert len(runs) <= 800, "Unexpectedly broad deletion set"
            assert all(x["status"] == "completed" for x in runs), "An old run is still active; stop before deleting"
            artifacts = [x for x in api.listing("/actions/artifacts", "artifacts") if older(x, cutoff)]
            caches = [x for x in api.listing("/actions/caches", "actions_caches") if older(x, cutoff)]
            workflows = api.listing("/actions/workflows", "workflows")
            state = {
                "repository": api.repo, "cutoff_utc": cutoff, "approved_prior_cleanup_run": extra_run,
                "cleanup_run_id": int(os.environ["GITHUB_RUN_ID"]),
                "created_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                "runs": [{k: x[k] for k in ("id", "created_at", "head_sha", "status")} for x in runs],
                "artifacts": [{k: x[k] for k in ("id", "created_at", "size_in_bytes")} for x in artifacts],
                "caches": [{k: x[k] for k in ("id", "created_at", "size_in_bytes")} for x in caches],
                "workflows": [{k: x[k] for k in ("id", "path", "state", "created_at")} for x in workflows],
                "release_identity_before": release_identity(api),
                "deleted_run_ids": [], "missing_run_ids": [], "deleted_artifact_ids": [],
                "deleted_cache_ids": [], "disabled_workflow_ids": [],
            }
            assert state["cleanup_run_id"] not in {x["id"] for x in runs}
            state["inventory_sha256"] = hashlib.sha256(json.dumps(state, sort_keys=True).encode()).hexdigest()
            save(state)
            print("CLEANUP_INVENTORY " + json.dumps({
                "repository": api.repo, "runs": len(runs), "artifacts": len(artifacts),
                "artifact_bytes": sum(x["size_in_bytes"] for x in artifacts),
                "caches": len(caches), "cache_bytes": sum(x["size_in_bytes"] for x in caches),
                "inventory_sha256": state["inventory_sha256"],
            }), flush=True)


        def load_state(api):
            state = json.loads(STATE.read_text())
            assert state["repository"] == api.repo
            assert state["cleanup_run_id"] == int(os.environ["GITHUB_RUN_ID"])
            return state


        def remove_slice(api, start):
            state = load_state(api)
            targets = state["runs"][start:start + 100]
            done = set(state["deleted_run_ids"] + state["missing_run_ids"])
            for item in targets:
                if item["id"] in done:
                    continue
                assert older(item, state["cutoff_utc"]) or item['id'] == state['approved_prior_cleanup_run']
                result = api.request("DELETE", f'/actions/runs/{item["id"]}', missing_ok=True)
                assert result["http_status"] in (204, 404)
                state["deleted_run_ids" if result["http_status"] == 204 else "missing_run_ids"].append(item["id"])
                save(state)
            print("CLEANUP_RUN_PROGRESS " + json.dumps({"repository": api.repo,
                "deleted": len(state["deleted_run_ids"]), "already_missing": len(state["missing_run_ids"]),
                "target": len(state["runs"])}), flush=True)


        def finalize(api):
            state = load_state(api)
            assert set(state["deleted_run_ids"] + state["missing_run_ids"]) == {x["id"] for x in state["runs"]}
            remaining_artifacts = {x["id"] for x in api.listing("/actions/artifacts", "artifacts")}
            for key, resource, receipt in (("artifacts", "artifacts", "deleted_artifact_ids"),
                                            ("caches", "caches", "deleted_cache_ids")):
                for item in state[key]:
                    if key == "artifacts" and item["id"] not in remaining_artifacts:
                        continue
                    result = api.request("DELETE", f'/actions/{resource}/{item["id"]}', missing_ok=True)
                    assert result["http_status"] in (204, 404)
                    state[receipt].append(item["id"])
                    save(state)
            # GitHub can remove an obsolete workflow registration after its last run is
            # deleted. Refresh this list instead of disabling stale inventory IDs.
            for workflow in api.listing('/actions/workflows', 'workflows'):
                if workflow["state"] != "active" or not older(workflow, state["cutoff_utc"]):
                    continue
                result = api.request("PUT", f'/actions/workflows/{workflow["id"]}/disable', missing_ok=True)
                assert result["http_status"] in (204, 404)
                if result['http_status'] == 204:
                    state["disabled_workflow_ids"].append(workflow["id"])
                else:
                    current = api.listing('/actions/workflows', 'workflows')
                    assert not any(x['id'] == workflow['id'] and x['state'] == 'active' for x in current), 'Workflow disable returned 404 but workflow is still active'
                save(state)
            runs_after = api.listing("/actions/runs", "workflow_runs")
            artifacts_after = api.listing("/actions/artifacts", "artifacts")
            caches_after = api.listing("/actions/caches", "actions_caches")
            releases_after = release_identity(api)
            old_runs = [x["id"] for x in runs_after if older(x, state["cutoff_utc"])]
            old_artifacts = [x["id"] for x in artifacts_after if older(x, state["cutoff_utc"])]
            old_caches = [x["id"] for x in caches_after if older(x, state["cutoff_utc"])]
            assert not old_runs and not old_artifacts and not old_caches
            assert state['approved_prior_cleanup_run'] not in {x['id'] for x in runs_after}
            active_old_workflows = [x['id'] for x in api.listing('/actions/workflows', 'workflows')
                                    if x['state'] == 'active' and older(x, state['cutoff_utc'])]
            assert not active_old_workflows, 'An old workflow is still active'
            assert releases_after == [tuple(x) for x in state["release_identity_before"]]
            summary = {
                "status": "VERIFIED_COMPLETE", "repository": api.repo,
                "cutoff_utc": state["cutoff_utc"], "cleanup_run_id": state["cleanup_run_id"],
                "deleted_runs": len(state["deleted_run_ids"]), "already_missing_runs": len(state["missing_run_ids"]),
                "artifacts_before": len(state["artifacts"]), "artifact_bytes_before": sum(x["size_in_bytes"] for x in state["artifacts"]),
                "caches_before": len(state["caches"]), "cache_bytes_before": sum(x["size_in_bytes"] for x in state["caches"]),
                "disabled_workflows": len(state["disabled_workflow_ids"]),
                "remaining_old_runs": len(old_runs), "remaining_artifacts": len(artifacts_after),
                "remaining_caches": len(caches_after), "remaining_new_run_ids": [x["id"] for x in runs_after],
                "remaining_active_old_workflows": len(active_old_workflows),
                "release_assets_unchanged": True, "git_files_modified_by_job": False,
                "inventory_sha256": state["inventory_sha256"],
            }
            state["summary"] = summary
            save(state)
            print("CLEANUP_FINAL " + json.dumps(summary), flush=True)
            with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
                handle.write("## Approved old Actions cleanup\n\n```json\n" + json.dumps(summary, indent=2) + "\n```\n")


        def main():
            parser = argparse.ArgumentParser()
            parser.add_argument("mode", choices=("inventory", "runs", "finalize"))
            parser.add_argument("--start", type=int, default=0)
            args = parser.parse_args()
            api = API()
            if args.mode == "inventory":
                inventory(api)
            elif args.mode == "runs":
                remove_slice(api, args.start)
            else:
                finalize(api)


        if __name__ == "__main__":
            main()
        PYCODE
        python /tmp/approved_cleanup.py inventory
    - name: Delete old completed runs 1-100
      run: python /tmp/approved_cleanup.py runs --start 0
    - name: Delete old artifacts and caches; disable old workflows; verify
      run: python /tmp/approved_cleanup.py finalize
